spring.application.name=api-gateway
server.port=8763

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Config Server
spring.cloud.config.uri=http://localhost:8762

# Spring Cloud Gateway
spring.cloud.gateway.discovery.locator.enabled=true

# Gateway Routes
spring.cloud.gateway.routes[0].id=PRODUCT-SERVICE
spring.cloud.gateway.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/product/**

spring.cloud.gateway.routes[1].id=SHOPPING-CART-SERVICE
spring.cloud.gateway.routes[1].uri=lb://SHOPPING-CART-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/shopping-cart/**

spring.cloud.gateway.routes[2].id=PRODUCT-SERVICE-FEIGN-CLIENT
spring.cloud.gateway.routes[2].uri=lb://PRODUCT-SERVICE-FEIGN-CLIENT
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/feign-client/**

spring.cloud.gateway.routes[3].id=ORDER-SERVICE
spring.cloud.gateway.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[4].id=USER-SERVICE
spring.cloud.gateway.routes[4].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/user/**


spring.cloud.gateway.routes[5].id=PAYMENT-SERVICE
spring.cloud.gateway.routes[5].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/payment/**


spring.cloud.gateway.routes[6].id=FAVORITE-LIST-SERVICE
spring.cloud.gateway.routes[6].uri=lb://FAVORITE-LIST-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/favorite-list/**


spring.cloud.gateway.routes[7].id=ORDER-SERVICE
spring.cloud.gateway.routes[7].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/orders/**


spring.cloud.gateway.routes[8].id=STOCK-SERVICE
spring.cloud.gateway.routes[8].uri=lb://STOCK-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/stock/**

spring.cloud.gateway.routes[9].id=PRODUCT-IMAGES
spring.cloud.gateway.routes[9].uri=http://localhost:8081
spring.cloud.gateway.routes[9].predicates[0]=Path=/images/**

